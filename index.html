<!doctype html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <script
      src="https://code.jquery.com/jquery-3.2.1.min.js"
      integrity="sha256-hwg4gsxgFZhOsEEamdOYGBf13FyQuiTwlAQgxVSNgt4="
      crossorigin="anonymous"></script>
    <script type="text/javascript" src="simcir.js"></script>
    <link rel="stylesheet" type="text/css" href="simcir.css" />
    <script type="text/javascript" src="simcir-basicset.js"></script>
    <link rel="stylesheet" type="text/css" href="simcir-basicset.css" />
    <script type="text/javascript" src="simcir-library.js"></script>
    <script type="text/javascript" src="vattend-client.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&family=Quicksand:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" type="text/css" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script type="text/javascript">
$(function() {

  var $s = simcir;
  var $simcir = $('#mySimcir');
  var $status = $('#status');
  var $list = $('#circuitList');
  var $name = $('#circuitName');
  var $samples = $('#sampleList');
  var canManageSamples = false;

  var getCircuitData = function() {
    return JSON.parse($s.controller($simcir.find('.simcir-workspace') ).text() );
  };
  var setCircuitData = function(data) {
    $s.setupSimcir($simcir, data);
  };
  var toastTimer = null;
  var message = function(text, isError) {
    var $t = $('#toast');
    $t.text(text).toggleClass('error', !!isError).addClass('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { $t.removeClass('show'); }, isError ? 5000 : 2500);
  };
  var setUser = function(text) { $status.text(text); };

  var fillSelect = function($select, items, withDate) {
    var selected = $select.val();
    $select.empty();
    items.forEach(function(c) {
      var label = withDate ? c.name + '  (' + c.updated_at.slice(0, 16).replace('T', ' ') + ')' : c.name;
      $('<option>').val(c.id).text(label).data('name', c.name).appendTo($select);
    });
    if (selected) { $select.val(selected); }
  };

  var refreshList = function() {
    return Promise.all([vattend.list(), vattend.listSamples()]).then(function(r) {
      fillSelect($list, r[0], true);
      fillSelect($samples, r[1], false);
    }).catch(function(e) {
      message('一覧の取得に失敗しました: ' + e.message, true);
    });
  };

  var render = function() {
    var loggedIn = vattend.isLoggedIn();
    $('#loginBtn').toggle(!loggedIn);
    $('#logoutBtn').toggle(loggedIn);
    $('.cloud-ops').toggle(loggedIn);
    if (!loggedIn) { canManageSamples = false; $('.staff-only').hide(); setUser(''); return; }
    vattend.me().then(function(me) {
      canManageSamples = !!me.can_manage_samples;
      setUser(me.name + ' さん' + (me.is_superuser ? ' (管理者)' : me.is_staff ? ' (スタッフ)' : '') );
      $('.staff-only').toggle(canManageSamples);
      return refreshList();
    }).catch(function() { render(); });
  };

  var run = function(promise, okText) {
    return promise.then(function(r) {
      if (okText) { message(okText); }
      return r;
    }).catch(function(e) {
      message('エラー: ' + e.message, true);
      if (!vattend.isLoggedIn() ) { render(); }
    });
  };

  $('#loginBtn').click(function() { vattend.login(); });
  $('#logoutBtn').click(function() { vattend.logout(); render(); });

  $('#saveBtn').click(function() {
    var name = $.trim($name.val() );
    if (!name) { message('名前を入力してください', true); return; }
    run(vattend.save(name, getCircuitData() ), '保存しました: ' + name).then(refreshList);
  });

  $('#loadBtn').click(function() {
    var id = $list.val();
    if (!id) { return; }
    run(vattend.get(id), '読み込みました').then(function(c) {
      if (!c) { return; }
      setCircuitData(c.data);
      $name.val(c.name);
    });
  });

  $('#sampleLoadBtn').click(function() {
    var id = $samples.val();
    if (!id) { return; }
    run(vattend.getSample(id), 'サンプルを読み込みました').then(function(c) {
      if (!c) { return; }
      setCircuitData(c.data);
      $name.val(c.name);
    });
  });

  $('#publishBtn').click(function() {
    var $opt = $list.find('option:selected');
    if (!$opt.length) { message('「ユーザー作成回路」から回路を選択してください', true); return; }
    if (!confirm('「' + $opt.data('name') + '」をサンプル回路に登録します(同名のサンプルは上書き)。よろしいですか?') ) { return; }
    run(vattend.publishSample($opt.val() ), 'サンプルに登録しました: ' + $opt.data('name') ).then(refreshList);
  });

  $('#sampleDeleteBtn').click(function() {
    var $opt = $samples.find('option:selected');
    if (!$opt.length || !confirm('サンプル「' + $opt.data('name') + '」を削除しますか?') ) { return; }
    run(vattend.removeSample($opt.val() ), 'サンプルを削除しました').then(refreshList);
  });

  $('#deleteBtn').click(function() {
    var $opt = $list.find('option:selected');
    if (!$opt.length || !confirm('「' + $opt.data('name') + '」を削除しますか?') ) { return; }
    run(vattend.remove($opt.val() ), '削除しました').then(refreshList);
  });

  setCircuitData({
    width: Math.max(600, window.innerWidth - 40),
    height: Math.max(400, window.innerHeight - 100)
  });

  vattend.handleRedirect().catch(function(e) {
    message('ログインに失敗しました: ' + e.message, true);
  }).then(function() {
    render();
  });
});
    </script>
    <title>SimcirJS</title>
  </head>
  <body>
    <div class="bg-blobs" aria-hidden="true">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>
    <header class="app-header">
      <span class="app-title">🔌 SimcirJS</span>
      <div class="cloud-ops" style="display:none;">
        <fieldset class="group group-user">
          <legend>ユーザー作成回路</legend>
          <input id="circuitName" type="text" maxlength="100" placeholder="回路名" />
          <button id="saveBtn" class="primary">保存</button>
          <select id="circuitList" aria-label="ユーザー作成回路"></select>
          <button id="loadBtn">読み込み</button>
          <button id="deleteBtn" class="danger">削除</button>
          <button id="publishBtn" class="staff-only" style="display:none;" title="選択中の回路をサンプル回路として全員に公開">サンプルに登録</button>
        </fieldset>
        <fieldset class="group group-sample">
          <legend>サンプル回路</legend>
          <select id="sampleList" aria-label="サンプル回路"></select>
          <button id="sampleLoadBtn">読み込み</button>
          <button id="sampleDeleteBtn" class="danger staff-only" style="display:none;">削除</button>
        </fieldset>
      </div>
      <span class="spacer"></span>
      <span id="status" class="user"></span>
      <button id="loginBtn" class="primary" style="display:none;">vattend でログイン</button>
      <button id="logoutBtn" style="display:none;">ログアウト</button>
    </header>
    <main>
      <div id="mySimcir"></div>
    </main>
    <div id="toast" role="status"></div>
  </body>
</html>
