<!doctype html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <script
      src="https://code.jquery.com/jquery-3.2.1.min.js"
      integrity="sha256-hwg4gsxgFZhOsEEamdOYGBf13FyQuiTwlAQgxVSNgt4="
      crossorigin="anonymous"></script>
    <script type="text/javascript" src="simcir.js"></script>
    <link rel="stylesheet" type="text/css" href="simcir.css" />
    <script type="text/javascript" src="simcir-basicset.js"></script>
    <link rel="stylesheet" type="text/css" href="simcir-basicset.css" />
    <script type="text/javascript" src="simcir-library.js"></script>
    <script type="text/javascript" src="vattend-client.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script type="text/javascript">
$(function() {

  var $s = simcir;
  var $simcir = $('#mySimcir');
  var $status = $('#status');
  var $list = $('#circuitList');
  var $name = $('#circuitName');

  var getCircuitData = function() {
    return JSON.parse($s.controller($simcir.find('.simcir-workspace') ).text() );
  };
  var setCircuitData = function(data) {
    $s.setupSimcir($simcir, data);
  };
  var toastTimer = null;
  var message = function(text, isError) {
    var $t = $('#toast');
    $t.text(text).toggleClass('error', !!isError).addClass('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { $t.removeClass('show'); }, isError ? 5000 : 2500);
  };
  var setUser = function(text) { $status.text(text); };

  var refreshList = function() {
    return vattend.list().then(function(items) {
      var selected = $list.val();
      $list.empty();
      items.forEach(function(c) {
        $('<option>').val(c.id).text(c.name + '  (' + c.updated_at.slice(0, 16).replace('T', ' ') + ')').
          data('name', c.name).appendTo($list);
      });
      if (selected) { $list.val(selected); }
    }).catch(function(e) {
      message('一覧の取得に失敗しました: ' + e.message, true);
    });
  };

  var render = function() {
    var loggedIn = vattend.isLoggedIn();
    $('#loginBtn').toggle(!loggedIn);
    $('#logoutBtn').toggle(loggedIn);
    $('.cloud-ops').toggle(loggedIn);
    if (!loggedIn) { setUser(''); return; }
    vattend.me().then(function(me) {
      setUser(me.name + ' さん');
      return refreshList();
    }).catch(function() { render(); });
  };

  var run = function(promise, okText) {
    return promise.then(function(r) {
      if (okText) { message(okText); }
      return r;
    }).catch(function(e) {
      message('エラー: ' + e.message, true);
      if (!vattend.isLoggedIn() ) { render(); }
    });
  };

  $('#loginBtn').click(function() { vattend.login(); });
  $('#logoutBtn').click(function() { vattend.logout(); render(); });

  $('#saveBtn').click(function() {
    var name = $.trim($name.val() );
    if (!name) { message('名前を入力してください', true); return; }
    run(vattend.save(name, getCircuitData() ), '保存しました: ' + name).then(refreshList);
  });

  $('#loadBtn').click(function() {
    var id = $list.val();
    if (!id) { return; }
    run(vattend.get(id), '読み込みました').then(function(c) {
      if (!c) { return; }
      setCircuitData(c.data);
      $name.val(c.name);
    });
  });

  $('#deleteBtn').click(function() {
    var $opt = $list.find('option:selected');
    if (!$opt.length || !confirm('「' + $opt.data('name') + '」を削除しますか?') ) { return; }
    run(vattend.remove($opt.val() ), '削除しました').then(refreshList);
  });

  setCircuitData({
    width: Math.max(600, window.innerWidth - 40),
    height: Math.max(400, window.innerHeight - 100)
  });
  var loginFailed = false;

  vattend.handleRedirect().catch(function(e) {
    loginFailed = true;
    message('ログインに失敗しました: ' + e.message, true);
  }).then(function() {
    render();
  });
});
    </script>
    <title>SimcirJS</title>
  </head>
  <body>
    <header class="app-header">
      <span class="app-title">SimcirJS</span>
      <div class="cloud-ops" style="display:none;">
        <input id="circuitName" type="text" maxlength="100" placeholder="回路名" />
        <button id="saveBtn" class="primary">保存</button>
        <select id="circuitList" aria-label="保存済みの回路"></select>
        <button id="loadBtn">読み込み</button>
        <button id="deleteBtn" class="danger">削除</button>
      </div>
      <span class="spacer"></span>
      <span id="status" class="user"></span>
      <button id="loginBtn" class="primary" style="display:none;">vattend でログイン</button>
      <button id="logoutBtn" style="display:none;">ログアウト</button>
    </header>
    <main>
      <div id="mySimcir"></div>
    </main>
    <div id="toast" role="status"></div>
  </body>
</html>
